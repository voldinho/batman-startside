<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batman Startside v4</title>
<style>
:root{--bg:#101218;--card:#1b2029;--card2:#222936;--line:#303847;--text:#f6f7fb;--muted:#9ea8b7}
*{box-sizing:border-box}body{margin:0;background:#0b0e13 url('batman-gotham-bg.png') center top/cover fixed no-repeat;color:var(--text);font-family:Segoe UI,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:rgba(5,8,13,.68);backdrop-filter:blur(1.5px);z-index:-1}
.wrap{max-width:1500px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap}
h1{margin:0;font-size:34px}.muted{color:var(--muted)}#clock{font-size:30px;font-weight:700;text-align:right}
.search{display:flex;max-width:850px;margin:24px auto;gap:8px}.search input{flex:1;padding:16px 18px;border-radius:14px;border:1px solid var(--line);font-size:18px}.search button{padding:0 24px;border:0;border-radius:14px;font-size:17px;cursor:pointer}
.quick,.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 20px}.quick a,.tab{color:var(--text);background:rgba(20,25,33,.88);backdrop-filter:blur(10px);border:1px solid rgba(120,140,165,.28);border-radius:12px;padding:10px 13px;text-decoration:none}.tab{cursor:pointer}.tab.active{background:#fff;color:#111}
.weather{display:flex;align-items:center;justify-content:space-between;gap:18px;background:rgba(20,25,33,.88);backdrop-filter:blur(10px);border:1px solid rgba(120,140,165,.28);border-radius:18px;padding:15px 18px;margin-bottom:18px}.weatherMain{display:flex;align-items:center;gap:13px}.wicon{font-size:42px}.wtemp{font-size:34px;font-weight:800}.forecast{display:flex;gap:8px;overflow:auto}.fday{min-width:86px;text-align:center;background:rgba(36,43,54,.78);border-radius:11px;padding:8px;font-size:12px}
.heroGrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}.hero,.sidecard,.newsCard{background:rgba(20,25,33,.88);backdrop-filter:blur(10px);border:1px solid rgba(120,140,165,.28);border-radius:18px;overflow:hidden}.hero{min-height:450px;position:relative}.hero img{width:100%;height:450px;object-fit:cover;display:block}.heroOverlay{position:absolute;inset:auto 0 0 0;padding:80px 22px 22px;background:linear-gradient(transparent,rgba(0,0,0,.9))}.heroTitle{font-size:32px;font-weight:800;line-height:1.08}.source{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#d9e0ea;margin-bottom:7px}.sideStack{display:grid;grid-template-rows:1fr 1fr;gap:16px}.sidecard a,.hero a,.newsCard a{color:inherit;text-decoration:none}.sidecard img{width:100%;height:145px;object-fit:cover}.sidebody,.cardbody{padding:12px}.sidetitle{font-size:18px;font-weight:750;line-height:1.15}
.sectionTitle{font-size:22px;margin:22px 0 12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.newsCard img,.fallback{width:100%;height:170px;object-fit:cover}.fallback{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#293242,#171c25);font-size:42px}.cardtitle{font-size:18px;font-weight:750;line-height:1.2}.cardtime{font-size:11px;color:var(--muted);margin-top:7px}.hidden{display:none!important}
@media(max-width:900px){.heroGrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.weather{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.cards{grid-template-columns:1fr}.wrap{padding:14px}.heroTitle{font-size:25px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Batman Startside">
</head>
<body><main class="wrap">
<header><div><h1>🦇 Batman Startside</h1><div class="muted">Din feed. Dine kilder. Ingen sponsede kort.</div></div><div><div id="clock"></div><div id="date" class="muted"></div></div></header>
<form class="search" action="https://www.google.com/search"><input name="q" autofocus placeholder="Søk med Google…"><button>Søk</button></form>
<nav class="quick">
<a href="https://chatgpt.com">ChatGPT</a><a href="https://www.finn.no">FINN</a><a href="https://www.youtube.com">YouTube</a><a href="https://makerworld.com">🧰 MakerWorld</a>
<a href="https://www.nrk.no">NRK</a><a href="https://www.sandnesposten.no">Sandnesposten</a><a href="https://www.tv2.no">TV 2</a><a href="https://www.nettavisen.no">Nettavisen</a><a href="https://www.vg.no">VG</a><a href="https://www.dagbladet.no">Dagbladet</a><a href="https://e24.no">E24</a>
</nav>
<section class="weather"><div class="weatherMain"><div id="wicon" class="wicon">🌤️</div><div><div class="muted">Sandnes</div><div id="wtemp" class="wtemp">—°</div><div id="wdesc" class="muted">Henter vær…</div></div></div><div id="forecast" class="forecast"></div></section>
<div class="tabs"><button class="tab active" data-cat="all">Alt</button><button class="tab" data-cat="news">Nyheter</button><button class="tab" data-cat="local">Lokalt</button><button class="tab" data-cat="sport">Sport</button><button class="tab" data-cat="money">Økonomi</button><button class="tab" data-cat="games">Tek / Gaming</button></div>

<section id="heroGrid" class="heroGrid"><div id="hero" class="hero"></div><div id="sideStack" class="sideStack"></div></section>
<h2 class="sectionTitle">Siste saker</h2><section id="cards" class="cards"></section>
</main>
<script>
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});date.textContent=d.toLocaleDateString('no-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}tick();setInterval(tick,1000);
const wt=c=>c===0?'Klart':c<=3?'Delvis skyet':c<=48?'Tåke':c<=57?'Yr':c<=67?'Regn':c<=77?'Snø':c<=82?'Regnbyger':c<=86?'Snøbyger':'Torden';
const wi=c=>c===0?'☀️':c<=3?'⛅':c<=48?'🌫️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌦️':c<=86?'🌨️':'⛈️';
async function weather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=58.8524&longitude=5.7352&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FOslo&forecast_days=5';const d=await(await fetch(u)).json();wtemp.textContent=Math.round(d.current.temperature_2m)+'°';wicon.textContent=wi(d.current.weather_code);wdesc.textContent=wt(d.current.weather_code)+' · Føles '+Math.round(d.current.apparent_temperature)+'° · Vind '+Math.round(d.current.wind_speed_10m)+' km/t';forecast.innerHTML=d.daily.time.map((x,i)=>`<div class="fday"><b>${new Date(x+'T12:00').toLocaleDateString('no-NO',{weekday:'short'})}</b><div style="font-size:22px">${wi(d.daily.weather_code[i])}</div>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°<div>💧${d.daily.precipitation_probability_max[i]??0}%</div></div>`).join('')}catch(e){wdesc.textContent='Værdata utilgjengelig akkurat nå'}}weather();

const feeds=[
['NRK','news','https://www.nrk.no/nyheter/siste.rss'],
['TV 2','news','https://www.tv2.no/rss/nyheter'],
['TV 2 Sport','sport','https://www.tv2.no/rss/sport'],
['Nettavisen','news','https://www.nettavisen.no/service/rich-rss?tag=nyheter'],
['Nettavisen Sport','sport','https://www.nettavisen.no/service/rich-rss?tag=sport'],
['Dagbladet','news','https://www.dagbladet.no/?lab_viewport=rss'],
['E24','money','https://e24.no/rss2/'],
['Gamereactor','games','https://www.gamereactor.no/rss/']
];
const sourcePages=[
['Sandnesposten','local','https://www.sandnesposten.no','Lokale nyheter fra Sandnes'],
['Tidens Krav','local','https://www.tk.no','Siste nytt fra Tidens Krav'],
['VG','news','https://www.vg.no','Siste nytt fra VG'],
['Tek.no','games','https://www.tek.no','Teknologi fra Tek.no'],
['Gamer.no','games','https://www.gamer.no','Spillnyheter fra Gamer.no'],
['Dine Penger','money','https://www.dinepenger.no','Personlig økonomi fra Dine Penger']
];
function imgOf(i){return i.thumbnail||i.enclosure?.link||i.enclosure?.url||((i.description||'').match(/<img[^>]+src=["']([^"']+)/i)||[])[1]||''}
function safe(s){return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function fetchFeed(f){try{const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f[2]));const d=await r.json();return(d.items||[]).slice(0,7).map(x=>({...x,source:f[0],cat:f[1],image:imgOf(x)}))}catch(e){return[]}}
function visual(i,h='card'){const image=i.image?`<img src="${i.image}" loading="lazy" onerror="this.outerHTML='<div class=&quot;fallback&quot;>📰</div>'">`:`<div class="fallback">📰</div>`;if(h==='hero')return `<a href="${i.link}" target="_blank" rel="noopener">${image}<div class="heroOverlay"><div class="source">${safe(i.source)}</div><div class="heroTitle">${safe(i.title)}</div></div></a>`;if(h==='side')return `<a href="${i.link}" target="_blank" rel="noopener">${image}<div class="sidebody"><div class="source">${safe(i.source)}</div><div class="sidetitle">${safe(i.title)}</div></div></a>`;return `<article class="newsCard" data-cat="${i.cat}"><a href="${i.link}" target="_blank" rel="noopener">${image}<div class="cardbody"><div class="source">${safe(i.source)}</div><div class="cardtitle">${safe(i.title)}</div><div class="cardtime">${i.pubDate?new Date(i.pubDate).toLocaleString('no-NO'):''}</div></div></a></article>`}
let items=[];
async function load(){for(const f of feeds)items.push(...await fetchFeed(f));items.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
sourcePages.forEach(s=>items.push({source:s[0],cat:s[1],link:s[2],title:s[3],image:'',pubDate:''}));
const withImages=items.filter(x=>x.image), top=(withImages.length>=3?withImages:items).slice(0,3);hero.innerHTML=visual(top[0]||items[0],'hero');sideStack.innerHTML=(top.slice(1,3)).map(x=>`<div class="sidecard">${visual(x,'side')}</div>`).join('');const used=new Set(top.map(x=>x.link));cards.innerHTML=items.filter(x=>!used.has(x.link)).map(x=>visual(x)).join('');}
load();
function filter(cat){document.querySelectorAll('.newsCard').forEach(c=>c.classList.toggle('hidden',cat!=='all'&&c.dataset.cat!==cat))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter(b.dataset.cat)});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
