name: Oppdater nyheter

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Hent ferske RSS-saker
        run: python3 scripts/fetch_news.py

      - name: Lagre news.json hvis den er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json

          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "Oppdater nyheter"
            git push
          fi
